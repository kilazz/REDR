name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  check:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --workspace --verbose

    - name: Check the dependency tree
      run: cargo tree --duplicates

  build:
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The dev profile builds into target/debug, the release profile into
          # target/release.
          - profile: dev
            target-dir: debug
          - profile: release
            target-dir: release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --workspace --profile ${{ matrix.profile }}

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: REDR-${{ matrix.profile }}
        path: target/${{ matrix.target-dir }}/REDR.exe
        if-no-files-found: error
