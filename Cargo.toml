[package]
name = "REDR"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "Fast empty-directory finder for Windows, with MFT scanning, dry-run and recycle bin support"
license = "MIT"
readme = "README.md"

[lib]
name = "redr"
path = "src/lib.rs"

[[bin]]
name = "REDR"
path = "src/main.rs"

[dependencies]
mimalloc = "0.1.52"
slint = { version = "1.19.0", features = ["unstable-winit-030"] }
ignore = "0.4.34"
rfd = "0.18.0"
trash = "5.3.0"
wildmatch = "2.7.0"
clap = { version = "4.6.8", features = ["derive"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
ntfs-reader = "0.6.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
proptest = "1.12.0"

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.19.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# The tests and the proptest run are much faster unoptimised, and the
# GUI is not used in them anyway.
[profile.test]
opt-level = 1

[profile.dev]
opt-level = 1
